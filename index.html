<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Đơn Giản</title>
    
    <!-- Phần CSS dùng để trang trí cho trang web -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #008CBA;
            color: white;
            width: 100%;
            text-align: center;
            padding: 1.5rem 0;
        }
        main {
            margin: 30px;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            text-align: center;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #45a049;
        }
        footer {
            margin-top: 20px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Phần tiêu đề trang web -->
    <header>
        <h1>Chào mừng đến với trang web của tôi</h1>
    </header>

    <!-- Phần nội dung chính -->
    <main>
        <h2>Xin chào! 👋</h2>
        <p>Đây là một trang web cực kỳ đơn giản được tạo bằng HTML và CSS cơ bản. Bạn có thể tự do chỉnh sửa đoạn chữ này thành bất kỳ nội dung nào bạn muốn.</p>
        
        <!-- Một nút bấm nhỏ có hiệu ứng Javascript -->
        <button onclick="alert('Cảm ơn bạn đã ghé thăm trang web!')">Nhấp thử vào đây!</button>
    </main>

    <!-- Phần chân trang -->
    <footer>
        <p>&copy; 2026 - Chúc bạn học HTML vui vẻ!</p>
    </footer>

</body>
</html>
